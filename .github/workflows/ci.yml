name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Instalar WebKit (motor do Safari) e Chromium
        run: npx playwright install --with-deps webkit chromium
      - name: E2E offline (WebKit e Chromium)
        run: npx playwright test --trace off
